version: 2

models:
  - name: hub_customer
    description: Unique customer business keys. Fed by stg_customer and stg_orders.
    columns:
      - name: customer_hk
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [unique, not_null]

  - name: hub_order
    description: Unique order business keys.
    columns:
      - name: order_hk
        data_tests: [unique, not_null]

  - name: hub_part
    description: Unique part business keys.
    columns:
      - name: part_hk
        data_tests: [unique, not_null]

  - name: link_order_customer
    description: Relationship between an order and the customer who placed it.
    columns:
      - name: order_customer_hk
        data_tests: [unique, not_null]
      - name: order_hk
        data_tests:
          - relationships:
              arguments:
                to: ref('hub_order')
                field: order_hk
      - name: customer_hk
        data_tests:
          - relationships:
              arguments:
                to: ref('hub_customer')
                field: customer_hk

  - name: link_order_line
    description: An order line - relationship between an order and a part, with line_number as dependent child key.
    columns:
      - name: order_line_hk
        data_tests: [unique, not_null]
      - name: order_hk
        data_tests:
          - relationships:
              arguments:
                to: ref('hub_order')
                field: order_hk
      - name: part_hk
        data_tests:
          - relationships:
              arguments:
                to: ref('hub_part')
                field: part_hk

  - name: sat_customer
    description: Customer attributes with history. One row per customer per change.
    data_tests:
      - unique:
          column_name: "customer_hk || '|' || load_date"
    columns:
      - name: customer_hk
        data_tests:
          - relationships:
              arguments:
                to: ref('hub_customer')
                field: customer_hk

  - name: sat_order
    description: Order attributes with history.
    data_tests:
      - unique:
          column_name: "order_hk || '|' || load_date"

  - name: sat_part
    description: Part attributes with history.
    data_tests:
      - unique:
          column_name: "part_hk || '|' || load_date"

  - name: sat_order_line
    description: Order line attributes (quantity, price, discount) with history. A link satellite.
    data_tests:
      - unique:
          column_name: "order_line_hk || '|' || load_date"
