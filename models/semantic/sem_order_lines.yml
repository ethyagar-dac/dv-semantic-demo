version: 2

semantic_models:
  - name: order_lines
    description: Order line facts. Grain = one order line.
    model: ref('fct_order_lines')
    defaults:
      agg_time_dimension: order_date

    entities:
      - name: order_line
        type: primary
        expr: order_line_hk
      - name: customer
        type: foreign
        expr: customer_hk
      - name: part
        type: foreign
        expr: part_hk

    dimensions:
      - name: order_date
        type: time
        type_params:
          time_granularity: day
      - name: order_status
        type: categorical

    measures:
      - name: net_revenue
        description: Sum of line revenue after discount.
        agg: sum
        expr: net_revenue
      - name: distinct_orders
        description: Number of distinct orders.
        agg: count_distinct
        expr: order_id
      - name: distinct_customers
        description: Number of distinct customers who placed an order.
        agg: count_distinct
        expr: customer_hk

  - name: customers
    description: Customer dimension, so metrics can be sliced by customer attributes.
    model: ref('dim_customer')

    entities:
      - name: customer
        type: primary
        expr: customer_hk

    dimensions:
      - name: market_segment
        type: categorical
      - name: nation_id
        type: categorical

  - name: parts
    description: Part dimension.
    model: ref('dim_part')

    entities:
      - name: part
        type: primary
        expr: part_hk

    dimensions:
      - name: brand
        type: categorical
      - name: manufacturer
        type: categorical
