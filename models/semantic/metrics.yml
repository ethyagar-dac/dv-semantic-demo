version: 2

# Governed metrics: each is defined once, here, and every consumer gets the same answer.

metrics:
  - name: revenue
    label: Revenue
    description: Net revenue (extended price less discount) of order lines.
    type: simple
    type_params:
      measure: net_revenue

  - name: order_count
    label: Orders
    description: Count of distinct orders.
    type: simple
    type_params:
      measure: distinct_orders

  - name: average_order_value
    label: Average order value
    description: Revenue divided by orders. A ratio, computed at query time so it re-aggregates correctly at any grain.
    type: ratio
    type_params:
      numerator: revenue
      denominator: order_count

  - name: active_customers
    label: Active customers
    description: Distinct customers with at least one order in the period.
    type: simple
    type_params:
      measure: distinct_customers
