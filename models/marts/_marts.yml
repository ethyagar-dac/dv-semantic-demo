version: 2

models:
  - name: dim_customer
    description: Current view of each customer. Built from hub_customer + latest sat_customer row.
    columns:
      - name: customer_hk
        description: Surrogate key (the vault hash key, reused).
        data_tests: [unique, not_null]
      - name: market_segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['AUTOMOBILE', 'BUILDING', 'FURNITURE', 'HOUSEHOLD', 'MACHINERY']

  - name: dim_part
    description: Current view of each part.
    columns:
      - name: part_hk
        data_tests: [unique, not_null]

  # TODO: tests for fct_order_lines
  #   - order_line_hk: unique + not_null  (this is your grain check)
  #   - customer_hk: not_null + relationships to dim_customer
  #   - part_hk: relationships to dim_part
  #   - add a description for net_revenue (how it's calculated)

  - name: metricflow_time_spine
    description: Daily date spine required by MetricFlow.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
