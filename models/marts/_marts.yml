version: 2

models:
  - name: dim_customer
    description: Current view of each customer. Built from hub_customer + latest sat_customer row.
    columns:
      - name: customer_hk
        description: Surrogate key (the vault hash key, reused).
        data_tests: [unique, not_null]
      - name: market_segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['AUTOMOBILE', 'BUILDING', 'FURNITURE', 'HOUSEHOLD', 'MACHINERY']

  - name: dim_part
    description: Current view of each part.
    columns:
      - name: part_hk
        data_tests: [unique, not_null]

  - name: fct_order_lines
    description: One row per order line. Additive measures only.
    columns:
      - name: order_line_hk
        data_tests: [unique, not_null]
      - name: customer_hk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_hk
      - name: part_hk
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_part')
                field: part_hk
      - name: net_revenue
        description: extended_price * (1 - discount). The basis of the revenue metric.

  - name: metricflow_time_spine
    description: Daily date spine required by MetricFlow.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
