version: 2

models:
  - name: stg_customer
    description: Customers from TPC-H, with hash key, hashdiff and load metadata.
    columns:
      - name: customer_hk
        description: Hash of the business key customer_id.
        data_tests: [unique, not_null]

  - name: stg_orders
    description: Orders in the configured date window.
    columns:
      - name: order_hk
        data_tests: [unique, not_null]
      - name: order_status
        description: F = fulfilled, O = open, P = partially fulfilled.
        data_tests:
          - accepted_values:
              arguments:
                values: ['F', 'O', 'P']

  - name: stg_lineitem
    description: Order lines for orders in the window. Grain = order_id + line_number.
    columns:
      - name: order_line_hk
        data_tests: [unique, not_null]

  - name: stg_part
    description: Parts from TPC-H.
    columns:
      - name: part_hk
        data_tests: [unique, not_null]
